<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Things To Do Today</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- nav -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold">
          <img
            src="https://icons.veryicon.com/png/o/business/time-management/calendar-337.png"
            alt="logo"
            width="50"
            height="50"
            class="d-inline-block me-2"
          />
          My Calendar
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
          <a href="#weatherTitle" class="nav-link fw-bold me-2">Weather</a>
          <a href="#newsList" class="nav-link fw-bold me-2">News</a>
        </div>
        <div class="">
          <button
            id="logout-btn"
            type="button"
            class="btn btn-transparent fw-bold"
            data-toggle="tooltip"
            data-placement="bottom"
            title="Logout"
          >
            Your account name
          </button>
        </div>
      </div>
    </nav>

    <!-- main -->
    <div class="container mt-4">
      <!-- weather -->
      <div class="card mb-4">
        <div class="card-body">
          <h5 class="card-title" id="weatherTitle">🌤 Thời tiết hôm nay</h5>
          <p id="weatherInfo" class="card-text text-muted">Đang tải...</p>
        </div>
      </div>
      <!-- news -->
      <div class="card mb-4">
        <div class="card-body">
          <h5 class="card-title">📰 Tin tức nổi bật</h5>
          <ul id="newsList" class="list-group list-group-flush"></ul>
        </div>
      </div>
      <!-- calendar -->
      <div class="card my-4">
        <div class="card calendar-card shadow-sm">
          <div
            class="card-header bg-white py-3 border-0 d-flex align-items-center justify-content-between"
          >
            <div class="d-flex align-items-center gap-2">
              <h5 class="mb-0 me-3">🕒 Lịch trình</h5>
              <button
                class="btn btn-outline-secondary btn-sm px-3"
                id="goToday-btn"
              >
                Today
              </button>
              <div class="d-flex ms-2">
                <button class="calendar-nav-btn" id="prevDate-btn">
                  <i class="bi bi-chevron-left"></i>
                </button>
                <button class="calendar-nav-btn" id="nextDate-btn">
                  <i class="bi bi-chevron-right"></i>
                </button>
              </div>
            </div>
            <span id="currentDateDisplay" class="fw-bold text-dark fs-5"
              >Jan 28, 2026</span
            >
          </div>

          <div class="calendar-grid">
            <div class="time-column" id="timeLabels"></div>

            <div class="events-column" id="events-column">
              <div
                class="calendar-event bg-blue event-left"
                style="
                  top: calc(var(--hour-height) * 9);
                  height: calc(var(--hour-height) * 2);
                "
              >
                Team Sync <br />
                <small>9:00 - 11:00</small>
              </div>
              <div
                class="calendar-event bg-purple event-right"
                data-id="taskId1"
                style="
                  top: calc(var(--hour-height) * 10);
                  height: calc(var(--hour-height) * 1.5);
                "
              >
                Design Review <br />
                <small>10:00 - 11:30</small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- popup -->
    <div class="modal fade" id="taskModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Chi tiết công việc</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <p><strong>Tiêu đề:</strong> <span id="taskTitle"></span></p>
            <p><strong>Mô tả:</strong> <span id="taskDesc"></span></p>
            <p><strong>Địa điểm:</strong> <span id="taskLoc"></span></p>
          </div>
          <div class="modal-footer">
            <button id="deleteBtn" type="button" class="btn btn-danger">
              Xoá
            </button>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Đóng
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/gemini.js"></script>
    <script src="./js/weather_api.js"></script>
    <script src="./js/news_api.js"></script>
    <script type="module" src="./js/calendar.js"></script>
    <script type="module" src="./js/nav.js"></script>
  </body>
</html>
