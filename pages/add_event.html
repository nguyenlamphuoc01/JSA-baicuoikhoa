<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Form sự kiện — Google Calendar style</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow-sm p-4 border-0">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h4 class="mb-0" id="formTitle">Tạo việc cần làm</h4>
              <button
                id="deleteBtn"
                type="button"
                class="btn btn-outline-danger btn-sm d-none"
              >
                <i class="bi bi-trash"></i> Xoá
              </button>
            </div>

            <form id="eventForm" autocomplete="off">
              <input type="hidden" id="taskId" />

              <div class="mb-3">
                <label class="form-label fw-bold">Tiêu đề</label>
                <input
                  id="title"
                  class="form-control"
                  placeholder="Ví dụ: Học nhóm Toán"
                  required
                />
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-bold">Bắt đầu</label>
                  <input
                    type="datetime-local"
                    id="startDate"
                    class="form-control"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-bold">Kết thúc</label>
                  <input
                    type="datetime-local"
                    id="endDate"
                    class="form-control"
                    required
                  />
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Mô tả</label>
                <textarea
                  id="description"
                  rows="2"
                  class="form-control"
                  placeholder="Ghi chi tiết..."
                ></textarea>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Địa điểm</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"
                    ><i class="bi bi-geo-alt"></i
                  ></span>
                  <input
                    id="location"
                    class="form-control border-start-0"
                    placeholder="Phòng A101"
                  />
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-bold">Màu sắc</label>
                <div class="color-selector" id="colorPickerContainer"></div>
              </div>

              <div class="d-flex justify-content-between pt-3 border-top">
                <button id="cancelBtn" type="button" class="btn btn-light px-4">
                  Huỷ
                </button>
                <button type="submit" class="btn btn-primary px-5">Lưu</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/calendar.js"></script>
    <script type="module" src="../js/add_event.js"></script>
  </body>
</html>
